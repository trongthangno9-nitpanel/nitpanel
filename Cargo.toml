[package]
name = "nitpanel"
version = "2.4.0"
edition = "2021"
authors = ["NITPANEL"]
description = "Lightweight PHP/Nginx/MySQL/Fail2ban web control panel for AlmaLinux 9/10"

[[bin]]
name = "nitpanel"
path = "src/main.rs"

[dependencies]
actix-web      = "4"
actix-multipart = "0.6"
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
uuid           = { version = "1", features = ["v4"] }
bcrypt         = "0.15"
jsonwebtoken   = "9"
chrono         = { version = "0.4", features = ["serde"] }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util   = "0.3"
rand           = "0.8"
reqwest        = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
