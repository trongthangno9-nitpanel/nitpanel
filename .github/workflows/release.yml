name: Build & Release NITPANEL

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AlmaLinux binary
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Install GHA deps
        run: dnf install -y git nodejs tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          dnf install -y gcc openssl-devel pkgconfig curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/nitpanel dist/
          cd dist
          tar -czf nitpanel-almalinux.tar.gz nitpanel
          sha256sum nitpanel-almalinux.tar.gz > nitpanel-almalinux.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nitpanel-almalinux.tar.gz
            dist/nitpanel-almalinux.tar.gz.sha256
          draft: false
          prerelease: false
